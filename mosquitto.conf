# ============================================================================
#  Mosquitto MQTT Broker — Configuración para IoT Campus
#  La usa docker-compose.yml (se monta en /mosquitto/config/mosquitto.conf).
#  Si se usa Mosquitto instalado en Windows, copiar este archivo a
#  C:\Program Files\mosquitto\mosquitto.conf y reiniciar el servicio.
# ============================================================================

# ─── Listener TCP estándar (ESP32, backend y simulador) ─────────────────────
listener 1883
protocol mqtt

# ─── Listener WebSocket (dashboard web) ─────────────────────────────────────
listener 9001
protocol websockets

# ─── Conexiones anónimas (solo desarrollo; ver Limitaciones en README) ──────
allow_anonymous true

# ─── Logging ─────────────────────────────────────────────────────────────────
log_dest stdout
log_type warning
log_type error
log_type notice
