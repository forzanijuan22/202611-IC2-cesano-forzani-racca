; Compilar con PlatformIO:  cd firmware && pio run
; (o abrir firmware/tanque_esp32/tanque_esp32.ino con Arduino IDE)
[platformio]
src_dir = tanque_esp32

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	knolleary/PubSubClient@2.8
	bblanchon/ArduinoJson@7.2.1
	tzapu/WiFiManager@2.0.17
